name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --verbose

  preload:
    name: preload (aarch64-glibc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: build
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -O2 \
            -o libbionilux_preload.so \
            src/preload/hooks.c \
            -Wl,--dynamic-linker=/lib/ld-linux-aarch64.so.1 \
            -Wl,-rpath,/usr/lib/aarch64-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: preload
          path: libbionilux_preload.so

  bionilux:
    name: bionilux (aarch64-bionic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r30

      - name: build
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/bin/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$TC/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TC/bin/llvm-ar"
          cargo build --release --locked --target aarch64-linux-android
          cp target/aarch64-linux-android/release/bionilux .

      - uses: actions/upload-artifact@v4
        with:
          name: bionilux
          path: bionilux

  box64:
    name: box64-glibc
    runs-on: ubuntu-24.04-arm
    steps:
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake build-essential python3

      - name: clone and build
        run: |
          git clone --depth 1 https://github.com/ptitSeb/box64 /tmp/box64
          cd /tmp/box64
          mkdir build && cd build
          cmake .. -DARM64=1 -DCMAKE_BUILD_TYPE=RelWithDebInfo
          make -j"$(nproc)"
          strip box64
          cp box64 "$GITHUB_WORKSPACE/box64-glibc"

      - uses: actions/upload-artifact@v4
        with:
          name: box64
          path: box64-glibc

  x86-libs:
    name: x86_64 runtime libs
    runs-on: ubuntu-latest
    steps:
      - name: fetch ubuntu 26.04 base rootfs (amd64)
        run: |
          set -eux
          curl -fLO http://cdimage.ubuntu.com/ubuntu-base/resolute/daily/current/resolute-base-amd64.tar.gz
          mkdir rootfs
          tar -xzf resolute-base-amd64.tar.gz -C rootfs

      - name: package
        run: |
          set -eux
          mkdir -p out/x86_64-linux-gnu
          cp -a rootfs/lib/x86_64-linux-gnu/. out/x86_64-linux-gnu/
          if [ -d rootfs/usr/lib/x86_64-linux-gnu ]; then
            cp -an rootfs/usr/lib/x86_64-linux-gnu/. out/x86_64-linux-gnu/
          fi
          cd out
          tar -cJf ../x86_64-libs.tar.xz x86_64-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-libs
          path: x86_64-libs.tar.xz

  release:
    name: release
    needs: [preload, bionilux, box64, x86-libs]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out/

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false